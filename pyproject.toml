[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-strategy-simulator"
version = "0.1.0"
description = "Reproducible S&P 500 strategy research and portfolio simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ewen Maugey" },
]
dependencies = []

[project.optional-dependencies]
data = [
  "pandas>=2.2,<4.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
]
test = [
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
sp500-backtest = "sp500_strategy_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
